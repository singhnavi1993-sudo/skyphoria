<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Skyphoria Digital</title>
    <script type="text/javascript">
      // Single Page Application Redirect for GitHub Pages (BrowserRouter support)
      (function() {
        var pathSegmentsToKeep = 1; // '/skyphoria/' has 1 segment
        var l = window.location;
        
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
  </body>
</html>
